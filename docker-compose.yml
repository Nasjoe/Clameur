services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clameur}
      POSTGRES_USER: ${POSTGRES_USER:-clameur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clameur_dev}
    volumes:
      - donnees_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clameur}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - medias:/app/medias
    ports:
      - "8000:8000"
    env_file: [.env]
    # Une variable posee devant `docker compose` n'entre pas dans le conteneur
    # sans cette clause : `make run` annoncait un mode DEBUG qu'il ne forcait
    # pas. Un `.env` avec DEBUG=false demontait alors la route /medias/, et
    # plus aucune capsule ne s'ecoutait en local.
    # / Without this clause the DEBUG prefix on `make run` did nothing.
    environment:
      DEBUG: "${DEBUG:-true}"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  celery:
    build: .
    command: celery -A clameur worker -l info
    volumes:
      - .:/app
      - medias:/app/medias
    env_file: [.env]
    environment:
      DEBUG: "${DEBUG:-true}"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  donnees_db:
  medias:
