services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clameur}
      POSTGRES_USER: ${POSTGRES_USER:-clameur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clameur_dev}
    volumes:
      - donnees_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clameur}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - medias:/app/medias
    ports:
      - "8000:8000"
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  celery:
    build: .
    command: uv run celery -A clameur worker -l info
    volumes:
      - .:/app
      - medias:/app/medias
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  donnees_db:
  medias:
