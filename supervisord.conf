; Supervision des process de production de Clameur.
; / Production process supervision for Clameur.
;
; DEUX MOTEURS, ET CHACUN SON ROLE :
;   gunicorn (WSGI, port 8001) sert les pages ;
;   daphne   (ASGI, port 8002) tient les connexions WebSocket.
; nginx aiguille /ws/ vers daphne et tout le reste vers gunicorn.
; / gunicorn serves pages, daphne holds the sockets; nginx routes between them.

[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; AUCUNE COMMANDE NE PASSE PAR `uv run` — lecon reprise d'Hypostasia.
; `uv run` laisse un process wrapper VIVANT entre supervisord et le programme
; reel. Supervisord surveille alors le wrapper : son SIGTERM d'arret va a `uv`
; et non au worker — or c'est le worker qui doit le recevoir pour finir sa
; tache en cours. Le PATH de l'image contient deja /opt/venv/bin.
; / No `uv run`: its wrapper would swallow the SIGTERM meant for the worker.

[program:gunicorn]
command=gunicorn clameur.wsgi:application --bind 0.0.0.0:8001 --workers 3 --timeout 180 --capture-output
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; --timeout 180 : la publication est SYNCHRONE et appelle ffmpeg. Le defaut de
; 30 s tuerait le worker au milieu d'une capsule longue. La valeur doit rester
; NETTEMENT AU-DESSUS du delai de ffmpeg (60 s, capsules/publication.py) : sinon
; gunicorn tue le worker avant que ffmpeg n'abandonne, et le repli sur l'audio
; d'origine n'est jamais atteint.
; / Must stay well above ffmpeg's own timeout, or the fallback is never reached.

[program:daphne]
; Le moteur WebSocket : il pousse les transcriptions vers les pages ouvertes
; des que Voxtral a fini.
; / The WebSocket engine: pushes transcriptions to open pages.
command=daphne -b 0.0.0.0 -p 8002 clameur.asgi:application
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

; DAPHNE NE RECHARGE JAMAIS LES CONSUMERS. Contrairement a runserver, il les
; charge au demarrage et les garde. Apres toute modification de
; capsules/consumers.py, un message d'un type inconnu est SILENCIEUSEMENT
; ignore : les journaux montrent la diffusion, mais rien n'arrive aux
; navigateurs. Redemarrer daphne fait partie du deploiement.
; / Daphne never hot-reloads consumers: unknown message types are silently
;   dropped until it is restarted.

[program:celery_worker]
command=celery -A clameur worker --loglevel=info --concurrency=2
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
; Une transcription Voxtral d'une capsule longue peut durer une minute.
; / A Voxtral transcription of a long capsule can take a minute.
stopwaitsecs=90
; SIGKILL de dernier recours au groupe entier : sans cela, un worker qui
; depasse stopwaitsecs est tue seul et laisse ses enfants prefork orphelins,
; avec toute leur memoire. L'arret NORMAL reste un SIGTERM au seul parent.
; / Last-resort SIGKILL to the group, or prefork children are left orphaned.
killasgroup=true

; PAS DE CELERY BEAT. Rien n'est periodique dans Clameur : la purge des
; brouillons est une commande que l'operateur lance en fin d'evenement, et la
; relance des jobs se fait depuis la console. Un planificateur inutile est un
; process de plus qui peut tomber sans qu'on s'en apercoive.
; / No beat: nothing is periodic here.
