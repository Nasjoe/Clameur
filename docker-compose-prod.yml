# Production : Traefik (TLS) -> nginx (fichiers) -> gunicorn (Django).
# / Production: Traefik for TLS, nginx for files, gunicorn for Django.
#
# Le reseau `frontend` est celui de la stack TraefikV3, il existe deja.
# / The `frontend` network belongs to the TraefikV3 stack.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # SUR LE DISQUE, PAS DANS UN VOLUME NOMME. Un volume nomme vit dans les
      # entrailles de Docker : on ne sait pas ou il est, `docker volume prune`
      # l'emporte sans prevenir, et le sauvegarder demande de passer par un
      # conteneur. Ici le chemin est visible, `pg_dump` et `rsync` y accedent
      # directement, et une suppression est un geste conscient.
      # / A named volume lives inside Docker: prune takes it without warning
      #   and backing it up requires a container. A path is visible and yours.
      - ./donnees/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    # L'entrypoint rafraichit les fichiers statiques dans leur volume avant de
    # ceder la place a supervisord, qui tient gunicorn, daphne et Celery.
    # / The entrypoint refreshes the static volume before handing over.
    entrypoint: ["/app/entrypoint-prod.sh"]
    command: ["supervisord", "-c", "/app/supervisord.conf"]
    env_file: [.env]
    volumes:
      # LES MEDIAS SONT LE PROJET. Ce sont les voix des gens : elles ne se
      # regenerent pas, contrairement au reste. Elles vivent donc a cote de la
      # base, sur le disque, la ou une sauvegarde les trouve.
      # / The media are the project: voices cannot be regenerated.
      - ./donnees/medias:/app/medias
      # Les statiques, eux, sont reconstruits a chaque demarrage : un volume
      # nomme leur suffit. / Static files are rebuilt at every start.
      - statiques:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/clameur.conf:/etc/nginx/conf.d/default.conf:ro
      - ./donnees/medias:/app/medias:ro
      - statiques:/app/staticfiles:ro
    depends_on: [web]
    networks: [default, frontend]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.clameur.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.clameur.tls.certresolver=myresolver"
      - "traefik.http.services.clameur.loadbalancer.server.port=80"

volumes:
  statiques:

networks:
  frontend:
    external: true
