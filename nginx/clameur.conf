# nginx de Clameur : sert les fichiers, passe le reste a gunicorn.
# / Clameur's nginx: serves files, proxies the rest to gunicorn.
#
# Traefik termine le TLS en amont ; nginx ne fait donc que du HTTP interne.
# / Traefik terminates TLS upstream; nginx only speaks plain HTTP.

# LE TYPE MIME DU .m4a EST DECLARE ICI, ET C'EST INDISPENSABLE.
# Le mime.types livre avec nginx associe .m4a a `audio/x-m4a`, une forme
# ancienne. On force `audio/mp4`. Servi sous un type inattendu, l'audio
# affiche un lecteur muet a « 0:00 / 0:00 » — le fichier est pourtant bon.
# / nginx maps .m4a to the legacy audio/x-m4a; we force audio/mp4.
types {
    audio/mp4  m4a;
    font/woff2 woff2;
}

# LE PROTOCOLE VU PAR LE CLIENT, PAS PAR NOUS.
# `$scheme` vaut toujours `http` ici : ce serveur ecoute en clair derriere
# Traefik, qui porte le TLS. Le propager tel quel faisait croire a Django
# qu'il servait du HTTP — `request.is_secure()` faux, cookies non securises,
# et une page jugee non securisee refuse le micro. On relaie donc ce que
# Traefik annonce, en retombant sur `$scheme` si l'en-tete est absent (nginx
# appele directement, en test).
# / $scheme is always http here; relay what Traefik declares instead.
map $http_x_forwarded_proto $protocole_du_client {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream clameur_gunicorn {
    server web:8001;
}

upstream clameur_daphne {
    server web:8002;
}

server {
    listen 80;
    server_name _;

    # Une capsule de dix minutes peut peser une dizaine de megaoctets, et la
    # publication envoie l'audio ET une photo.
    # / A ten-minute capsule plus a photo needs room.
    client_max_body_size 64M;

    # La publication est synchrone (ffmpeg) : laisser le temps a gunicorn.
    # / Publishing is synchronous (ffmpeg): give gunicorn time.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location /static/ {
        alias /app/staticfiles/;
        # Les fichiers statiques portent leur empreinte dans leur nom : leur
        # contenu ne peut pas changer sans que l'URL change, on peut donc les
        # mettre en cache pour de bon.
        # / Hashed names: the content cannot change without the URL changing.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /medias/ {
        alias /app/medias/;

        # LE SUPPORT DES REQUETES RANGE EST LE POINT CRITIQUE DE CE FICHIER.
        # Le lecteur media des navigateurs demande des plages d'octets et
        # attend un 206 ; face a un 200, il reste bloque et n'affiche aucune
        # duree. nginx le gere nativement — il suffit de ne pas le desactiver
        # (pas de gzip sur l'audio, il ferait sauter Accept-Ranges).
        # / Range support is the critical part: gzip here would kill it.
        gzip off;
        add_header Accept-Ranges bytes;

        expires 7d;
        access_log off;
    }

    # LES WEBSOCKETS VONT A DAPHNE, PAS A GUNICORN. gunicorn est un serveur
    # WSGI : il ne sait pas negocier une montee en protocole et repondrait 400.
    # Les trois en-tetes Upgrade/Connection sont ce qui autorise le passage en
    # WebSocket ; sans eux, nginx transmettrait une requete HTTP ordinaire.
    # / WebSockets go to daphne: gunicorn is WSGI and cannot upgrade.
    location /ws/ {
        proxy_pass http://clameur_daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protocole_du_client;
        # Une socket inactive ne doit pas etre coupee entre deux
        # transcriptions : le defaut de soixante secondes fermerait la
        # connexion de tout visiteur qui regarde la page sans rien faire.
        # / Idle sockets must survive between transcriptions.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://clameur_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sans ce dernier en-tete, Django se croit en HTTP derriere le TLS de
        # Traefik : il construit des URL absolues en http:// et le navigateur
        # refuse le micro sur une page jugee non securisee.
        # / Without this Django thinks it is on HTTP and the microphone is refused.
        proxy_set_header X-Forwarded-Proto $protocole_du_client;
    }
}
